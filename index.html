<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كارت م. محمد عبدالرحمن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: phone-width card in matte black — gold-foil cover with pipe-network pattern, portrait in foil ring, round actions, gold save CTA, stats, contact rows, chips, QR sheet, AR/EN toggle */
:root{
  --bg:#0b0a09; --surface:#131211; --raise:#1c1a18; --deep:#060505;
  --line:rgba(226,190,110,.24); --line-hi:rgba(226,190,110,.55);
  --gold:#d9b468; --gold-hi:#f5e0a6; --gold-lo:#a7843b; --ink:#f4f1ea; --muted:#a39d91;
  --display:"Amiri","Times New Roman",serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --foil:linear-gradient(115deg,var(--gold-lo) 0%,var(--gold-hi) 28%,var(--gold) 45%,var(--gold-hi) 62%,var(--gold-lo) 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;
  background-image:radial-gradient(90% 55% at 50% -10%,#2a2622 0%,transparent 70%);background-attachment:fixed}
.card{max-width:430px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:30px;overflow:hidden;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06)}
.cover{position:relative;height:150px;background:linear-gradient(160deg,#25221e,var(--deep));overflow:hidden}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover .brand{position:absolute;top:20px;inset-inline-start:20px;font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:500;direction:ltr}
.cover .brand b{font-weight:600;color:var(--gold-hi)}
.cover::after{content:"";position:absolute;inset:auto 0 0;height:2px;background:var(--foil)}
.lang{position:absolute;top:14px;inset-inline-end:14px;z-index:2;display:flex;border:1px solid var(--line-hi);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.lang button{border:0;background:none;color:var(--muted);font:600 12px var(--body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--foil);color:#2a1f06}
.shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(245,224,166,.14) 50%,transparent 60%);transform:translateX(100%)}
@media (prefers-reduced-motion:no-preference){.shine{animation:shine 6s ease-in-out 1s infinite}}
@keyframes shine{0%{transform:translateX(100%)}35%,100%{transform:translateX(-100%)}}
.id{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 22px;margin-top:-62px;position:relative;gap:6px}
.ring{width:128px;height:128px;border-radius:50%;padding:3px;background:var(--foil);box-shadow:0 0 0 6px var(--surface),0 12px 40px rgba(217,180,104,.32)}
.ring > div{width:100%;height:100%;border-radius:50%;background:var(--deep);display:grid;place-items:center;overflow:hidden}
.ring img{width:100%;height:100%;object-fit:cover}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.3;margin:10px 0 0;text-wrap:balance}
.verified{display:inline-flex;vertical-align:middle;margin-inline-start:6px}
.verified svg{width:20px;height:20px}
.role{font-size:15px;font-weight:500;color:var(--gold-hi)}
.org{font-size:13px;color:var(--muted)}
.bio{margin:8px 0 0;color:#d9d4ca;font-size:14px;line-height:1.85;font-weight:300;max-width:36ch}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:22px 22px 0}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-size:12px;background:none;border:0;font-family:var(--body);cursor:pointer;padding:0}
.q i{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line);transition:all .2s}
.q:hover i{border-color:var(--gold);background:#26231f;transform:translateY(-2px)}
.q:hover{color:var(--ink)}
svg.ic{width:23px;height:23px;fill:none;stroke:var(--gold-hi);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cta{padding:20px 22px 0}
.save{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;padding:17px;border-radius:18px;
  background:var(--foil);color:#2a1f06;font:600 17px var(--body);box-shadow:0 14px 30px -12px rgba(217,180,104,.7),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s}
.save:active{transform:scale(.98)}
.save svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 22px 0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(0,0,0,.3)}
.stats div{padding:14px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stats div + div{border-inline-start:1px solid var(--line)}
.stats b{font-family:var(--display);font-size:24px;color:var(--gold-hi);font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:11.5px;color:var(--muted)}
.sec{padding:24px 22px 0;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:11.5px;font-weight:500;letter-spacing:.12em;color:var(--gold)}
.row{display:flex;align-items:center;gap:12px;background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.row .ri{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(217,180,104,.12)}
.row .ri svg{width:19px;height:19px}
.row .t{flex:1;min-width:0}
.row small{display:block;font-size:11px;color:var(--muted)}
.row .v{display:block;font-size:14px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v.ar{direction:inherit;text-align:start}
html[lang="en"] .row .v{text-align:left}
.copy{flex:none;background:none;border:1px solid var(--line);color:var(--gold-hi);font:500 12px var(--body);padding:7px 11px;border-radius:10px;cursor:pointer}
.copy:hover{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(217,180,104,.08);color:#ebe6dc}
.qrbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:16px;background:transparent;border:1px dashed var(--line-hi);color:var(--gold-hi);font:500 15px var(--body);cursor:pointer}
.qrbtn:hover{background:rgba(217,180,104,.08)}
.social{display:flex;justify-content:center;gap:12px;padding:24px 22px 0}
.social a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:border-color .2s}
.social a:hover{border-color:var(--gold)}
.social svg{width:20px;height:20px}
.foot{margin-top:24px;padding:16px 22px 20px;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--muted);line-height:1.8}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line-hi);border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.sheet h2{margin:0;font-family:var(--display);font-size:24px;color:var(--gold-hi)}
.sheet p{margin:0;font-size:13px;color:var(--muted)}
.qrframe{padding:3px;border-radius:20px;background:var(--foil);margin-top:4px}
#qr{background:#fff;padding:14px;border-radius:17px;line-height:0}
#qr img{display:block;width:216px;max-width:100%;height:auto;image-rendering:pixelated}
.close{margin-top:4px;background:none;border:1px solid var(--line);color:var(--ink);font:500 14px var(--body);padding:10px 26px;border-radius:12px;cursor:pointer}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(92vw,380px);
  background:var(--raise);border:1px solid var(--gold);color:var(--ink);padding:12px 16px;border-radius:14px;font-size:13px;line-height:1.7;text-align:center}
</style>
</head>
<body>

<main class="card">
  <div class="cover">

    <div class="brand">MIC · <b>INFRASTRUCTURE</b></div>

      <div class="t"><small data-t="mobile"></small><span class="v" id="phoneTxt"></span></div><button class="copy" data-copy="phone" data-t="copy" type="button"></button></div>

    <div class="row"><div class="ri"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
      <div class="t"><small data-t="area"></small><span class="v ar" data-k="area"></span></div></div>

  <section class="sec">

  <section class="sec">

  <div class="social">

</main>

    pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
    pts.forEach((p,i)=>{if(i%2)return;x.strokeStyle="rgba(245,224,166,.38)";x.lineWidth=1;x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+(rnd()-.5)*60,i%4?0:h);x.stroke()});
    pts.forEach(p=>{x.fillStyle="#131211";x.strokeStyle="rgba(245,224,166,.85)";x.lineWidth=1.4;x.beginPath();x.arc(p[0],p[1],4,0,7);x.fill();x.stroke()});
  }
  draw();addEventListener("resize",draw);
})();

$("saveBtn").addEventListener("click",()=>{
  const a1=CARD.ar,e1=CARD.en;
  const v=["BEGIN:VCARD","VERSION:3.0","N;CHARSET=UTF-8:;"+a1.name+";;;","FN;CHARSET=UTF-8:"+a1.name+" | "+e1.name,
    "ORG;CHARSET=UTF-8:"+e1.org,"TITLE;CHARSET=UTF-8:"+a1.title+" | "+e1.title,"TEL;TYPE=CELL:"+CARD.phone,
    "EMAIL;TYPE=WORK:"+CARD.email,"URL:"+link(),"END:VCARD"].join("\r\n");
  if(inFrame){toast(T[lang].noDl);return}
  const url=URL.createObjectURL(new Blob([v],{type:"text/vcard;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="Mohamed-Abdelrhman.vcf";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);toast(T[lang].dl);
});

document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>{
  const val=CARD[b.dataset.copy];
  navigator.clipboard.writeText(val).then(()=>{b.textContent=T[lang].copied;setTimeout(()=>b.textContent=T[lang].copy,1600)})
    .catch(()=>{const s=b.previousElementSibling.querySelector(".v"),r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast(T[lang].sel)});
}));

$("qrBtn").addEventListener("click",()=>{$("qrModal").hidden=false;$("qrClose").focus()});
const closeQr=()=>$("qrModal").hidden=true;
$("qrClose").addEventListener("click",closeQr);
$("qrModal").addEventListener("click",e=>{if(e.target.id==="qrModal")closeQr()});
addEventListener("keydown",e=>{if(e.key==="Escape")closeQr()});
</script>
</body>
